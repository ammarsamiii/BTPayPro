apiVersion: apps/v1
kind: Deployment
metadata:
  name: btpaypro-api
  namespace: btpaypro
  labels:
    app: btpaypro-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: btpaypro-api
  template:
    metadata:
      labels:
        app: btpaypro-api
    spec:
      containers:
        - name: api
          image: samii99/btpaypro-api:latest
          imagePullPolicy: Always   # toujours tirer la dernière image pushée par Jenkins
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: mssql-secret
                  key: CONNECTION_STRING

          # ✅ Probes basées sur ton endpoint /api/health (que tu as déjà testé en 200)
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
