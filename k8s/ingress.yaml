apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: btpaypro-ingress
  namespace: btpaypro
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - http:
        paths:

          # -------- API --------
          - path: /api/?(.*)
            pathType: Prefix
            backend:
              service:
                name: btpaypro-api
                port:
                  number: 80

          # -------- WEBUI --------
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: btpaypro-webui
                port:
                  number: 80
